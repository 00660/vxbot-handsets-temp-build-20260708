name: iBox Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android-panel

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare stable APK signing key
        env:
          IBOX_ANDROID_KEYSTORE_B64: ${{ secrets.IBOX_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$IBOX_ANDROID_KEYSTORE_B64"
          printf '%s' "$IBOX_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ibox-native.p12"
      - name: Build debug APK
        env:
          IBOX_KEYSTORE_PATH: ${{ runner.temp }}/ibox-native.p12
          IBOX_KEYSTORE_PASSWORD: ${{ secrets.IBOX_ANDROID_SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/ibox-gradle.log"
      - name: Report build failure
        if: failure()
        run: |
          message="$(awk '/ error: / { print; exit }' "$RUNNER_TEMP/ibox-gradle.log")"
          if [ -z "$message" ]; then message="$(tail -n 1 "$RUNNER_TEMP/ibox-gradle.log")"; fi
          echo "::error title=Gradle build::$message"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ibox-native-debug-apk
          path: app/build/outputs/apk/debug/*.apk
