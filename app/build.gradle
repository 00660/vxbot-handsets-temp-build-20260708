plugins {
    id "com.android.application"
}

android {
    namespace "com.vxbot.wechatbot"
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.vxbot.wechatbot"
        minSdk 26
        targetSdk 35
        versionCode 239
        versionName "0.1.239-offline-paddleocr"
        multiDexKeepProguard file("multidex-keep.pro")
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11 -frtti -fexceptions -Wno-format"
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_ARM_NEON=TRUE"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["../src"]
        }
    }

    ndkVersion "21.4.7075529"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/paddleocr/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "androidx.core:core:1.13.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

def paddleOcrRuntime = file("$projectDir/paddleocr-runtime")
def paddleOcrAssets = file("$projectDir/src/main/assets/paddleocr")
def paddleOcrDownloads = file("$buildDir/paddleocr-downloads")

tasks.register("preparePaddleOcrRuntime") {
    inputs.property("paddleLiteUrl", "https://paddleocr.bj.bcebos.com/libs/paddle_lite_libs_v2_10.tar.gz")
    inputs.property("openCvUrl", "https://paddlelite-demo.bj.bcebos.com/libs/android/opencv-4.2.0-android-sdk.tar.gz")
    inputs.property("modelsUrl", "https://paddleocr.bj.bcebos.com/PP-OCRv2/lite/ch_PP-OCRv2.tar.gz")
    inputs.property("labelsUrl", "https://paddleocr.bj.bcebos.com/dygraph_v2.0/lite/ch_dict.tar.gz")
    outputs.dir(paddleOcrRuntime)
    outputs.dir(paddleOcrAssets)

    doLast {
        delete(paddleOcrRuntime)
        delete(paddleOcrAssets)
        paddleOcrDownloads.mkdirs()

        def archives = [
                [name: "paddle_lite_libs_v2_10.tar.gz", url: "https://paddleocr.bj.bcebos.com/libs/paddle_lite_libs_v2_10.tar.gz", destination: new File(paddleOcrRuntime, "PaddleLite")],
                [name: "opencv-4.2.0-android-sdk.tar.gz", url: "https://paddlelite-demo.bj.bcebos.com/libs/android/opencv-4.2.0-android-sdk.tar.gz", destination: new File(paddleOcrRuntime, "OpenCV")],
                [name: "ch_PP-OCRv2.tar.gz", url: "https://paddleocr.bj.bcebos.com/PP-OCRv2/lite/ch_PP-OCRv2.tar.gz", destination: new File(paddleOcrAssets, "models")],
                [name: "ch_dict.tar.gz", url: "https://paddleocr.bj.bcebos.com/dygraph_v2.0/lite/ch_dict.tar.gz", destination: new File(paddleOcrAssets, "labels")]
        ]
        archives.each { archive ->
            File local = new File(paddleOcrDownloads, archive.name)
            if (!local.isFile()) {
                ant.get(src: archive.url, dest: local, usetimestamp: true)
            }
            copy {
                from tarTree(resources.gzip(local))
                into archive.destination
            }
        }
    }
}

tasks.configureEach {
    if (name.startsWith("configureCMake") || name.startsWith("externalNativeBuild") || name.startsWith("merge")) {
        dependsOn("preparePaddleOcrRuntime")
    }
}
