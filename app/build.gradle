plugins {
    id "com.android.application"
}

android {
    namespace "com.ibox.nativepanel"
    compileSdk 35

    defaultConfig {
        applicationId "com.ibox.nativepanel"
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName "0.4.3-native-direct"
    }

    signingConfigs {
        debug {
            def signingPath = System.getenv("IBOX_KEYSTORE_PATH")
            if (signingPath != null && !signingPath.isEmpty()) {
                storeFile file(signingPath)
                storePassword System.getenv("IBOX_KEYSTORE_PASSWORD")
                keyAlias "iboxnative"
                keyPassword System.getenv("IBOX_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation("com.geetest.captcha:captcha:1.5.1") {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    }
}
